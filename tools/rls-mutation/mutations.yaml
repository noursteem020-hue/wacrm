- id: update_using_true
  name: contacts_update USING (true), no WITH CHECK clause
  touched_objects: [policies]
  apply_sql: |
    DROP POLICY contacts_update ON public.contacts;
    CREATE POLICY contacts_update ON public.contacts AS PERMISSIVE FOR UPDATE TO public USING (true);
  restore_sql: |
    DROP POLICY IF EXISTS contacts_update ON public.contacts;
    CREATE POLICY contacts_update ON public.contacts AS PERMISSIVE FOR UPDATE TO public USING (is_account_member(account_id, 'agent'::account_role_enum));
  restore_is_idempotent: true
  should_be_red: true
  predicted_red: true
  predicted_exit: 3
  matching_rule: prefix
  ledger_line: "[9a] FAIL leak: an unscoped UPDATE touched "
  gap_if_green: A green run means the unscoped-UPDATE shape is not actually detected, and the previously silent hole is still silent.
  fingerprint_fields: [schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check]

- id: update_with_check_true
  name: contacts_update WITH CHECK (true), USING left at baseline
  touched_objects: [policies]
  apply_sql: |
    DROP POLICY contacts_update ON public.contacts;
    CREATE POLICY contacts_update ON public.contacts AS PERMISSIVE FOR UPDATE TO public USING (is_account_member(account_id, 'agent'::account_role_enum)) WITH CHECK (true);
  restore_sql: |
    DROP POLICY IF EXISTS contacts_update ON public.contacts;
    CREATE POLICY contacts_update ON public.contacts AS PERMISSIVE FOR UPDATE TO public USING (is_account_member(account_id, 'agent'::account_role_enum));
  restore_is_idempotent: true
  should_be_red: true
  predicted_red: false
  predicted_exit: 0
  matching_rule: prefix
  ledger_line: "[9a] FAIL cross-account UPDATE was ALLOWED ("
  gap_if_green: The missing probe is the UNSCOPED account_id move. With a WHERE clause the UPDATE needs read privilege, so PostgreSQL applies the SELECT policy to the NEW row too and is_account_member(B) rejects it - the SELECT policy acts as a second WITH CHECK. An UPDATE with no WHERE needs no read privilege, so the new row is never checked against SELECT; under this mutation all of A's rows should move to B. The probe only attempts the targeted (WHERE) shape, so the unscoped shape is unverified.
  missing_probe: unscoped account_id move (UPDATE contacts SET account_id = <B> with no WHERE)
  fingerprint_fields: [schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check]

